# Pramaan policy-as-code.
# Evaluated by the deterministic Policy Engine (NO LLM). Human-readable on purpose:
# a judge should understand your guardrails by reading this file.
# All money amounts are in integer paise (₹1 = 100 paise).

version: 1

# Hard limits — a violation here is an immediate DENY.
limits:
  per_transaction_cap_paise: 200000        # ₹2,000 max single txn
  velocity:
    window_seconds: 3600                    # rolling 1 hour
    max_txns: 5                             # at most 5 money moves / hour / user
    max_total_paise: 500000                 # at most ₹5,000 / hour / user
  max_pending_step_ups: 3                   # at most 3 STEP_UP requests awaiting a
                                             # human per user at once (approval-queue
                                             # flooding defense)

# Only these merchants can receive money. Anything else => DENY (goal-hijack defense).
merchant_allowlist:
  - merchant_demo_01

# Category gating. Fails CLOSED: a cart whose intent has no category, or one
# outside this list, is denied -- an omitted field is never a way to skip a
# control. HONEST LIMIT: category is a field on the INTENT, which the user's
# own agent signs -- it is a self-declared purpose label, not a
# merchant-attested fact. Deriving category from what's actually in the cart
# (a merchant/SKU registry) is future work.
allowed_categories:
  - retail
  - groceries

# Amounts at or above this require a human approval (STEP_UP), not auto-execute.
step_up:
  amount_threshold_paise: 100000            # ₹1,000+ => human in the loop
  # also step up if the intent was signed in 'human_present: false' (delegated) mode
  step_up_on_delegated_intent: true

# Mandate freshness. NOT actually configurable from here -- both are always
# enforced in mandates/scope.py and mandates/nonce.py regardless of this
# file. Listed so the invariant is visible; the loader rejects `false` for
# either, since that would document a control that isn't real.
mandate:
  reject_if_expired: true
  reject_replayed_nonce: true               # each CART mandate nonce usable once.
                                             # The Intent mandate is reusable until
                                             # it expires -- bounded by max_amount_paise,
                                             # its own merchant_allowlist, and the
                                             # velocity caps above.

# The ACTUAL evaluation order, validated at load time to be an exact
# permutation of the registered rule names (control-plane/policy/rule_names.py)
# -- so this file and the code cannot silently drift apart. First DENY wins;
# else the first STEP_UP; else ALLOW.
evaluation_order:
  - mandate_expiry
  - per_transaction_cap
  - velocity_txn_count
  - velocity_total_amount
  - max_pending_step_ups
  - merchant_allowlist
  - category
  - step_up_amount_threshold
  - step_up_delegated_intent
